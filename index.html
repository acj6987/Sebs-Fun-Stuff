<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster Quest 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2340;--card:#ffffff;--accent:#ff5a3c;--blue:#2f7df6;--gold:#ffc83a;--bg:#8fd3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Fredoka,system-ui,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:#fff}
button.blue{background:var(--blue);color:#fff}
button.gold{background:var(--gold)}
/* screens */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;padding:24px 16px;background:linear-gradient(180deg,#5cc3ff 0%,#a8e6ff 55%,#9be37a 55%,#62c24e 100%)}
.screen h1{font-size:clamp(34px,7vw,64px);margin:8px 0 0;color:#fff;text-shadow:0 4px 0 #1d5fbf,0 8px 18px rgba(0,0,0,.25);text-align:center;letter-spacing:1px}
.screen h2{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);margin:10px 0 16px;text-align:center}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:980px}
.card{background:#fff;border-radius:22px;padding:12px;width:200px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;border:4px solid transparent;transition:transform .12s}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:var(--accent)}
.card img{width:150px;height:150px;object-fit:contain}
.card b{display:block;font-size:20px}
.card small{display:block;color:#566;min-height:38px}
.perk{display:inline-block;margin-top:6px;background:#eef4ff;border-radius:10px;padding:2px 8px;font-size:13px;color:#2a4ea8}
.type{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;color:#fff;font-weight:700}
/* HUD */
#hud{position:fixed;left:0;top:0;right:0;z-index:10;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hudLeft{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.pill{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hudBtns{display:flex;gap:6px;flex-wrap:wrap}
#hudBtns button{padding:7px 11px;font-size:14px}
#minimap{width:150px;height:150px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25);background:#7cc55a;pointer-events:none}
#zoneToast{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:11;color:#fff;font-size:clamp(26px,5vw,44px);font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .5s;text-align:center;white-space:nowrap}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
#prompt{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);z-index:12;background:rgba(29,35,64,.85);color:#fff;border-radius:14px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
#prompt kbd{background:#fff;color:var(--ink);border-radius:6px;padding:0 6px;margin-right:6px}
/* touch controls */
#joy{position:fixed;left:22px;bottom:22px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);z-index:12;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
#touchBtns{position:fixed;right:20px;bottom:24px;z-index:12;display:flex;gap:12px;align-items:flex-end}
#touchBtns button{width:74px;height:74px;border-radius:50%;font-size:15px;padding:0}
#btnJump{background:var(--blue);color:#fff}
#btnAct{background:var(--accent);color:#fff;width:64px!important;height:64px!important}
/* panels */
.panel{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 40px);background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--blue);color:#fff}
.panel header h3{margin:0;flex:1;font-size:22px}
.panel header button{padding:6px 12px}
.panel .body{padding:14px 16px;overflow-y:auto}
.avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.avatar img{width:60px;height:60px;object-fit:cover;margin-top:12px}
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:220px;max-height:46vh;background:#f2f7ff}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;line-height:1.35}
.msg.them{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#chatQuick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
#chatQuick button{padding:6px 10px;font-size:14px}
#chatForm{display:flex;gap:8px;padding:10px 12px 14px}
#chatInput{flex:1;font:inherit;font-size:16px;padding:10px 14px;border-radius:14px;border:2px solid #cfdcf5;outline:none;min-width:0}
#chatInput:focus{border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:#f4f7fd;margin-bottom:8px}
.row img{width:56px;height:56px;object-fit:contain;flex:none}
.row .info{flex:1;min-width:0}
.row .info b{font-size:17px}
.bar{height:10px;background:#dde3ef;border-radius:6px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:#3ccf5a;border-radius:6px;transition:width .4s}
.bar.xp>i{background:#4aa3ff}
.row button{padding:6px 10px;font-size:13px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.dex{background:#f4f7fd;border-radius:14px;padding:6px;text-align:center;font-size:13px}
.dex img{width:84px;height:84px;object-fit:contain}
.dex.unseen img{filter:brightness(0) opacity(.35)}
.quest{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#f4f7fd;margin-bottom:6px}
.quest.done{background:#e3f8e6;color:#2a7a3a}
.quest .tick{font-size:20px}
.inside-art{font-size:64px;text-align:center;margin:4px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* battle */
#battle{position:fixed;inset:0;z-index:30;pointer-events:none}
.hpcard{position:absolute;background:rgba(255,255,255,.95);border-radius:16px;padding:8px 14px;min-width:230px;box-shadow:0 4px 0 rgba(0,0,0,.15);pointer-events:auto}
.hpcard b{font-size:18px}
.hpcard .lv{float:right;font-weight:700}
#enemyCard{left:16px;top:16px}
#playerCard{right:16px;bottom:200px}
#battleBox{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap}
#battleMsg{flex:1 1 300px;background:#fff;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:600;min-height:86px;border:4px solid var(--ink);cursor:pointer;line-height:1.35}
#battleMenu{flex:1 1 300px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
#battleMenu button{font-size:17px;padding:12px 8px}
#battleMenu button.wide{grid-column:span 2}
.flash{animation:fl .4s}
@keyframes fl{0%,100%{filter:none}50%{filter:brightness(2)}}
#help kbd{background:#eef;border-radius:6px;padding:0 6px;border:1px solid #ccd}
@media (max-width:640px){
  #minimap{width:104px;height:104px}
  #playerCard{bottom:auto;top:96px;right:12px;min-width:190px}
  #enemyCard{min-width:190px}
  #battleMsg{font-size:16px;min-height:70px}
}
#joy{display:none!important}
#dpad{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:6px;background:rgba(255,255,255,.3);border-radius:26px;padding:8px}
#dpad button{width:76px;height:76px;padding:0;font-size:36px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:16px;background:rgba(255,255,255,.92);touch-action:none}
#dpad button.down-on{background:#ffc83a;transform:translateY(3px)}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .r{grid-column:3;grid-row:2}#dpad .d{grid-column:2;grid-row:3}
#dpad .mid{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5)}
@media (max-width:640px){#dpad{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px;padding:6px}#dpad button{width:60px;height:60px;font-size:30px}#touchBtns{flex-direction:column;align-items:flex-end;gap:8px}#touchBtns button{width:62px!important;height:62px!important}}
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hudLeft">
    <div class="pill" id="hudStats"></div>
    <div class="pill" id="hudBadges"></div>
    <div id="hudBtns">
      <button id="bTeam">🎒 Team</button>
      <button id="bDex">📖 Monster Book</button>
      <button id="bQuest">🗺️ Adventures</button>
      <button id="bHelp">❓</button>
    </div>
  </div>
  <canvas id="minimap" width="300" height="300"></canvas>
</div>
<div id="zoneToast"></div>
<div id="toast"></div>
<div id="prompt" class="hidden"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<div id="dpad" class="hidden"><button class="u" data-x="0" data-z="1" aria-label="Walk forward">⬆️</button><button class="l" data-x="-1" data-z="0" aria-label="Walk left">⬅️</button><span class="mid">MOVE</span><button class="r" data-x="1" data-z="0" aria-label="Walk right">➡️</button><button class="d" data-x="0" data-z="-1" aria-label="Walk backward">⬇️</button></div>
<div id="touchBtns" class="hidden"><button id="btnAct">Talk</button><button id="btnJump">Jump</button></div>

<!-- Title -->
<div class="screen" id="title">
  <h1>Monster Quest 3D</h1>
  <h2>Pick your hero!</h2>
  <div class="cards" id="heroCards"></div>
  <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="primary" id="btnHeroNext" disabled style="font-size:22px;padding:14px 30px">Next ➜</button>
    <button class="gold hidden" id="btnContinue" style="font-size:22px;padding:14px 30px">Continue my adventure</button>
  </div>
</div>
<div class="screen hidden" id="starter">
  <h1>Choose a partner!</h1>
  <h2>Your very first monster friend</h2>
  <div class="cards" id="starterCards"></div>
  <div style="margin-top:18px"><button class="primary" id="btnStart" disabled style="font-size:22px;padding:14px 30px">Start adventure!</button></div>
</div>

<!-- Chat -->
<div class="panel hidden" id="chat">
  <header><div class="avatar" id="chatAvatar"></div><h3 id="chatName"></h3><button id="chatClose">Bye 👋</button></header>
  <div id="chatLog"></div>
  <div id="chatQuick"></div>
  <form id="chatForm" autocomplete="off"><input id="chatInput" placeholder="Type anything to chat..." maxlength="200"><button class="blue" type="submit">Send</button></form>
</div>

<!-- generic panel -->
<div class="panel hidden" id="panel">
  <header><h3 id="panelTitle"></h3><button id="panelClose">Close ✕</button></header>
  <div class="body" id="panelBody"></div>
</div>

<!-- Battle -->
<div id="battle" class="hidden">
  <div class="hpcard" id="enemyCard"><span class="lv" id="eLv"></span><b id="eName"></b> <span id="eType"></span><div class="bar"><i id="eHp"></i></div></div>
  <div class="hpcard" id="playerCard"><span class="lv" id="pLv"></span><b id="pName"></b> <span id="pType"></span><div class="bar"><i id="pHp"></i></div><div style="font-size:13px;text-align:right" id="pHpTxt"></div><div class="bar xp" style="height:5px"><i id="pXp"></i></div></div>
  <div id="battleBox"><div id="battleMsg"></div><div id="battleMenu"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= helpers =================
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ================= sound =================
let AC=null;
function beep(f=440,d=.1,type='square',vol=.05,slide=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={
  hit:()=>beep(160,.15,'sawtooth',.06,-80),
  super:()=>{beep(220,.12,'sawtooth',.07,200);setTimeout(()=>beep(120,.2,'sawtooth',.07,-60),90)},
  jump:()=>beep(300,.15,'sine',.05,300),
  catch:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.07),i*110))},
  wobble:()=>beep(200,.08,'triangle',.05),
  level:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.04),i*90))},
  click:()=>beep(700,.04,'square',.03),
  win:()=>{[523,523,523,698,880].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*140))},
  heal:()=>{[660,880,990].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.06),i*120))},
};

// ================= data =================
const TYPES={
  normal:{name:'Normal',color:'#a8a07e',hex:0xd8d0b0},
  fire:{name:'Fire',color:'#ff6a2a',hex:0xff7a2a},
  water:{name:'Water',color:'#2f7df6',hex:0x4aa8ff},
  grass:{name:'Grass',color:'#33a845',hex:0x5fd25a},
  electric:{name:'Electric',color:'#e0a800',hex:0xffe23a},
  rock:{name:'Rock',color:'#94795a',hex:0xb09070},
  ghost:{name:'Ghost',color:'#8a5cc8',hex:0xb07aff},
  ice:{name:'Ice',color:'#3cb8d8',hex:0xbff4ff},
  air:{name:'Air',color:'#6a8cf0',hex:0xe0ecff},
};
const STRONG={fire:['grass','ice'],water:['fire','rock'],grass:['water','rock'],electric:['water','air'],rock:['fire','air','ice'],ghost:['ghost'],ice:['grass','air'],air:['grass'],normal:[]};
function eff(a,d){if(a==='normal')return 1;if(STRONG[a].includes(d))return 2;if((STRONG[d]||[]).includes(a))return .5;if(a===d)return .5;return 1}
const TYPE_MOVE={fire:'Flame Burst',water:'Water Splash',grass:'Leaf Slash',electric:'Spark Zap',rock:'Stone Throw',ghost:'Spooky Shadow',ice:'Frost Bite',air:'Gust Wing'};
const BIG_MOVE={fire:'Inferno Blast',water:'Tidal Crash',grass:'Vine Storm',electric:'Lightning Storm',rock:'Boulder Crush',ghost:'Phantom Scream',ice:'Blizzard Blast',air:'Tornado Spin'};
function typeTag(t){return `<span class="type" style="background:${TYPES[t].color}">${TYPES[t].name}</span>`}

function S_(name,type,shape,color,acc,zones,hp,atk,def,rare,size,desc){return{name,type,shape,color,acc,zones,hp,atk,def,rare,size,desc}}
const SPECIES=[
 S_('Embercub','fire','cat',0xff7a33,0xffd23a,['volcano'],40,12,9,0,1,'A playful cub whose tail is always on fire.'),
 S_('Flarebit','fire','blob',0xff4d2e,0xffe066,['volcano'],36,11,8,0,.95,'A bouncy fireball that giggles when it pops.'),
 S_('Magmaw','fire','dragon',0xc4281c,0xffa020,['volcano'],56,16,13,1,1.35,'A mighty dragon that naps inside the volcano.'),
 S_('Splashel','water','turtle',0x4aa8ff,0x2e6fd1,['lake'],44,10,12,0,1,'A little turtle that squirts water to say hi.'),
 S_('Bubblo','water','blob',0x7fd4ff,0xffffff,['lake'],38,10,9,0,.95,'Blows bubbles that float for days.'),
 S_('Tidalon','water','dragon',0x2a5fd8,0x9fe8ff,['lake'],58,15,14,1,1.35,'Rules Splash Lake. It can make huge waves.'),
 S_('Leafkit','grass','cat',0x5fcf5a,0x2f8a2f,['forest'],42,11,10,0,1,'Hides in bushes and pounces on falling leaves.'),
 S_('Sprouty','grass','blob',0x9be35a,0xff7ab8,['meadow','forest'],38,9,10,0,.95,'A happy sprout with a flower on its head.'),
 S_('Thornox','grass','turtle',0x3a7a2a,0xa0e060,['forest'],56,14,16,1,1.3,'An ancient forest guardian covered in moss.'),
 S_('Zappip','electric','bird',0xffe03a,0x333333,['meadow'],34,12,7,0,.95,'A tiny bird that sparks when it sings.'),
 S_('Voltmouse','electric','cat',0xffd000,0xff5a5a,['meadow'],36,13,8,0,.9,'Super fast! Its cheeks crackle with power.'),
 S_('Thundrake','electric','dragon',0xf0c000,0x4a4aff,['cliffs','meadow'],54,17,12,1,1.35,'Rides thunderclouds across the sky.'),
 S_('Pebblet','rock','rocky',0x9a8a7a,0x6a5a4a,['mountain'],44,10,14,0,.95,'A pebble that bounces like a ball. Boing!'),
 S_('Bouldash','rock','turtle',0x7a6a5a,0xc0a080,['mountain'],50,12,15,0,1.05,'Rolls down mountains at amazing speed.'),
 S_('Cragon','rock','dragon',0x6a6060,0xe0a040,['mountain'],60,16,16,1,1.35,'Its scales are as hard as diamonds.'),
 S_('Boolin','ghost','ghost',0xd8d0ff,0x6a4aa0,['graveyard','forest'],36,12,8,0,1,'Says BOO! then gets scared of itself.'),
 S_('Shadewisp','ghost','ghost',0x5a3a8a,0xff4ad8,['graveyard'],40,14,9,0,1,'A shadowy wisp that glows pink at night.'),
 S_('Phantorn','ghost','dragon',0x3a2a5a,0xb070ff,['graveyard'],54,17,12,1,1.35,'A spooky dragon that can walk through walls.'),
 S_('Frostpup','ice','cat',0xbfefff,0x4ab0e0,['snow'],42,12,10,0,1,'A frosty puppy that loves snowball fights.'),
 S_('Snowbun','ice','blob',0xffffff,0x9fd8ff,['snow'],40,10,11,0,.95,'Looks just like a snowball with ears.'),
 S_('Glacirex','ice','dragon',0x8fd8f8,0xffffff,['snow'],58,16,15,1,1.35,'Breathes blizzards. Very cool. Literally.'),
 S_('Featherz','air','bird',0xb8c8ff,0xff9a3a,['cliffs','meadow'],36,11,8,0,.95,'Flies loop-de-loops just for fun.'),
 S_('Gustling','air','bird',0xe8f0ff,0x6a9aff,['cliffs'],38,12,9,0,1,'Makes little whirlwinds with its wings.'),
 S_('Skyleon','air','dragon',0x7aa8ff,0xffe080,['cliffs'],60,18,13,1,1.35,'The king of the clouds.'),
 S_('Jumpstar','air','star',0xffd23a,0xffffff,[],70,20,16,2,1.2,'LEGENDARY! Lives at the top of Cloud Heights. It can jump to the moon!'),
];
const JUMPSTAR=24;
const STARTERS=[0,3,6];

const ZONES={
 town:{name:'Jumpstone Town',x:0,z:0,r:34,color:0x93cf62,lv:[2,4]},

function collide(px,pz,py){for(const o of obstacles){const dx=px-o.x,dz=pz-o.z,d=Math.hypot(dx,dz),r=o.r+.45;if(d<r&&d>0){px=o.x+dx/d*r;pz=o.z+dz/d*r}}
 for(const p of platforms){if(py<p.y-.7&&py+2.4>p.y-p.h){const hw=p.w/2+.4,hd=p.d/2+.4,dx=px-p.x,dz=pz-p.z;if(Math.abs(dx)<hw&&Math.abs(dz)<hd){const ox=hw-Math.abs(dx),oz=hd-Math.abs(dz);if(ox<oz)px=p.x+Math.sign(dx||1)*hw;else pz=p.z+Math.sign(dz||1)*hd}}}
 const d=Math.hypot(px,pz);if(d>158){px*=158/d;pz*=158/d}return[px,pz]}
function zoneAt(x,z){let best='town',bd=1e9;for(const k in ZONES){const Z=ZONES[k],d=Math.hypot(x-Z.x,z-Z.z)/Z.r;if(d<bd){bd=d;best=k}}return bd<1?best:'wilds'}
let curZone='town',encounterCD=2,wTime=0;
function updatePlayer(dt){
 let ix=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x+dpad.x+(dtap.t>0?dtap.x:0);
 let iz=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joy.y+dpad.z+(dtap.t>0?dtap.z:0);if(dtap.t>0)dtap.t-=dt;
 const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}
 const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=-fz,rz=fx;
 let mx=fx*iz+rx*ix,mz=fz*iz+rz*ix;
 const inWater=Math.hypot(player.x-ZONES.lake.x,player.z-ZONES.lake.z)<27&&player.y<.5;
 const sp=(keys['shift']?11:8)*player.speedMul*(inWater?.65:1);
 const mlen=Math.hypot(mx,mz);
 if(mlen>.05){let nx=player.x+mx*sp*dt,nz=player.z+mz*sp*dt;[nx,nz]=collide(nx,nz,player.y);player.x=nx;player.z=nz;const ty=Math.atan2(mx,mz);let d=ty-player.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;player.yaw+=d*Math.min(1,dt*12)}
 player.vy-=24*dt;player.y+=player.vy*dt;const g=groundAt(player.x,player.z,player.y);
 if(player.y<=g){player.y=g;player.vy=0;player.onGround=true}else player.onGround=false;
 const m=player.mesh;m.position.set(player.x,player.y-(inWater?.45:0),player.z);m.rotation.y=player.yaw;animPerson(m,player.onGround?Math.min(1,mlen):.3,wTime);
 const z=zoneAt(player.x,player.z);if(z!==curZone){curZone=z;if(z!=='wilds'){showZone(ZONES[z].name);if(!S.visited.includes(z)){S.visited.push(z);save()}}}
}
function updateCamera(dt){const t=new THREE.Vector3(player.x,player.y+1.8,player.z);const cp=Math.cos(camPitch);const want=new THREE.Vector3(t.x+Math.sin(camYaw)*cp*camDist,t.y+Math.sin(camPitch)*camDist,t.z+Math.cos(camYaw)*cp*camDist);camera.position.lerp(want,Math.min(1,dt*8));if(camera.position.y<.8)camera.position.y=.8;camera.lookAt(t);
 sun.position.set(player.x+30,60,player.z+20);sun.target.position.set(player.x,0,player.z)}
function updateWild(dt){if(encounterCD>0)encounterCD-=dt;
 for(const w of wild){w.timer-=dt;if(!w.still){if(w.timer<=0){w.timer=rand(2,5);const Z=ZONES[w.zone];if(Math.random()<.35){w.tx=w.x;w.tz=w.z}else{const a=Math.random()*7,d=Math.sqrt(Math.random())*(Z.r-5);w.tx=Z.x+Math.sin(a)*d;w.tz=Z.z+Math.cos(a)*d}}
  const dx=w.tx-w.x,dz=w.tz-w.z,d=Math.hypot(dx,dz);let moving=0;if(d>.3){const s=Math.min(d,2.2*dt);let nx=w.x+dx/d*s,nz=w.z+dz/d*s;if(freeDyn(nx,nz,.6)){w.x=nx;w.z=nz;moving=1}else w.timer=0;w.mesh.rotation.y=Math.atan2(dx,dz)}
  const isG=SPECIES[w.sp].shape==='ghost',fly=SPECIES[w.sp].shape==='bird';w.mesh.position.set(w.x,(isG?.6+Math.sin(wTime*2+w.phase)*.25:fly?Math.abs(Math.sin(wTime*4+w.phase))*.4:moving?Math.abs(Math.sin(wTime*8+w.phase))*.25:0),w.z)}
 else{w.mesh.position.y=w.fixedY+.3+Math.sin(wTime*2)*.25;w.mesh.rotation.y+=dt*.8}
 w.mesh.traverse(o=>{if(o.userData.wing)o.rotation.z=o.userData.wing*(.4+Math.sin(wTime*12+w.phase)*.4)});
 if(encounterCD<=0&&mode==='world'){const dy=Math.abs((w.mesh.position.y)-(player.y));if(Math.hypot(w.x-player.x,w.z-player.z)<1.4*SPECIES[w.sp].size+.3&&dy<2.5){if(!S.party.some(m=>m.hp>0)){toast('Your monsters are too tired! Visit the Healing Center.');encounterCD=3;continue}startWildBattle(w);break}}}}
function updateNPCs(dt){for(const n of npcs){if(n.talking){animPerson(n.mesh,0,wTime);continue}n.timer-=dt;if(n.timer<=0){n.timer=rand(2,6);const a=Math.random()*7,d=Math.random()*n.wander;n.tx=n.home[0]+Math.sin(a)*d;n.tz=n.home[1]+Math.cos(a)*d}
 const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);let mv=0;if(d>.3){const s=Math.min(d,(n.key==='z'?4.5:2.5)*dt);n.x+=dx/d*s;n.z+=dz/d*s;mv=1;n.mesh.rotation.y=Math.atan2(dx,dz)}n.mesh.position.set(n.x,0,n.z);animPerson(n.mesh,mv,wTime+n.home[0])}}

let nearest=null;
function checkInteract(){nearest=null;let bd=1e9;
 for(const n of npcs){const d=Math.hypot(n.x-player.x,n.z-player.z);if(d<3&&d<bd){bd=d;nearest={label:'Talk to '+n.def.name,act:()=>openChat(n)}}}
 for(const it of interactables){if(it.chest&&S.chests.includes(it.chest.id))continue;if(it.y!=null&&Math.abs(it.y-player.y)>2)continue;const d=Math.hypot(it.x-player.x,it.z-player.z);if(d<it.r&&d<bd){bd=d;nearest=it}}
 const pr=$('prompt');if(nearest){pr.innerHTML=`<kbd>E</kbd>${esc(nearest.label)}`;pr.classList.remove('hidden');$('btnAct').textContent=nearest.label.startsWith('Talk')?'Talk':'Go'}else{pr.classList.add('hidden');$('btnAct').textContent='Talk'}}

const mm=$('minimap').getContext('2d');let mmT=0;
function drawMinimap(){const W=300,sc=W/340;mm.clearRect(0,0,W,W);mm.save();mm.translate(W/2,W/2);mm.fillStyle='#7cc55a';mm.beginPath();mm.arc(0,0,W/2,0,7);mm.fill();
 for(const k in ZONES){const Z=ZONES[k];mm.fillStyle='#'+Z.color.toString(16).padStart(6,'0');mm.beginPath();mm.arc(Z.x*sc,Z.z*sc,Z.r*sc,0,7);mm.fill()}
 mm.fillStyle='#2f8fe0';mm.beginPath();mm.arc(ZONES.lake.x*sc,ZONES.lake.z*sc,27*sc,0,7);mm.fill();
 mm.font='bold 22px Arial';mm.textAlign='center';mm.textBaseline='middle';
 for(const k in LEADERS){const[x,z]=LEADERS[k].pos;mm.fillText(LEADERS[k].icon,x*sc,z*sc)}
 mm.fillStyle='#ffeb3b';for(const c of chests)if(!S.chests.includes(c.id)){mm.fillRect(c.x*sc-3,c.z*sc-3,6,6)}
 for(const n of npcs){mm.fillStyle='#fff';mm.beginPath();mm.arc(n.x*sc,n.z*sc,5,0,7);mm.fill()}
 mm.translate(player.x*sc,player.z*sc);mm.rotate(-player.yaw+Math.PI);mm.fillStyle='#ff3b30';mm.strokeStyle='#fff';mm.lineWidth=3;mm.beginPath();mm.moveTo(0,-11);mm.lineTo(8,8);mm.lineTo(-8,8);mm.closePath();mm.fill();mm.stroke();mm.restore()}

 await lunge(am,dm,mv.type);const r=calcDmg(att,def,mv,isPlayer);def.hp=Math.max(0,def.hp-r.dmg);r.e>1?sfx.super():sfx.hit();refreshCards();await shake(dm);
 if(r.crit)await say('A critical hit!',800);if(r.e>1)await say("It's super effective! 💥",900);else if(r.e<1)await say("It's not very effective…",900)}
function enemyMove(){const e=B.enemyTeam[B.ei],p=S.party[B.pi];const mv=movesFor(e);if(Math.random()<.6){return mv.reduce((b,m)=>m.power*eff(m.type,SPECIES[p.sp].type)>b.power*eff(b.type,SPECIES[p.sp].type)?m:b)}return pick(mv)}
async function doTurn(act){setMenu([]);const p=S.party[B.pi],e=B.enemyTeam[B.ei];
 if(act.kind==='move'){await attack(p,e,act.mv,true);if(e.hp<=0){await enemyFainted();return}}
 else if(act.kind==='ball'){const caught=await throwBall(act.sup);if(caught)return}
 else if(act.kind==='potion'){S.potions--;p.hp=Math.min(stats(p).maxHp,p.hp+40);sfx.heal();burst(bP.position,0x66ff99,16);refreshCards();await say(`${SPECIES[p.sp].name} feels better! 💚`,1000)}
 else if(act.kind==='switch'){await say(`Come back, ${SPECIES[p.sp].name}!`,800);await faintAnim(bP);B.pi=act.i;placeMon('p',S.party[B.pi]);refreshCards();await popIn(bP);await say(`Go, <b>${SPECIES[S.party[B.pi].sp].name}</b>!`,900)}
 const cur=S.party[B.pi];await attack(e,cur,enemyMove(),false);
 if(cur.hp<=0){await playerFainted();return}
 mainMenu()}
async function throwBall(sup){if(sup)S.superballs--;else S.balls--;updateHUD();const e=B.enemyTeam[B.ei],sp=SPECIES[e.sp];
 await say(`You threw a ${sup?'Super Ball':'Jump Ball'}!`,600);
 const ball=new THREE.Group();ball.add(P(G.hemi,sup?0x8e24aa:0xe53935,[0,0,0],.3));ball.add(P(G.hemi,0xffffff,[0,0,0],.3,[Math.PI,0,0]));ball.add(P(G.cyl,0x222222,[0,0,0],[.31,.04,.31]));bScene.add(ball);
 const from=new THREE.Vector3(-5.6,2.2,1),to=new THREE.Vector3(bE.position.x,1.2,bE.position.z);
 await tween(.6,k=>{ball.position.lerpVectors(from,to,k);ball.position.y+=Math.sin(k*Math.PI)*3;ball.rotation.x+=.3});
 burst(to,0xffffff,20);bE.userData.busy=true;const s0=bE.scale.x;await tween(.3,k=>bE.scale.setScalar(Math.max(.01,s0*(1-k))));bE.visible=false;
 await tween(.3,k=>{ball.position.y=1.2-k*.9});
 const hpF=e.hp/stats(e).maxHp;let chance=.3+.62*(1-hpF)+(sup?.22:0)-(sp.rare===1?.18:sp.rare===2?.38:0)+(S.hero==='galley'?.1:0)-(e.lvl-S.party[B.pi].lvl)*.01;chance=clamp(chance,.05,.97);
 const wobbleOK=[Math.random()<Math.pow(chance,1/3),Math.random()<Math.pow(chance,1/3),Math.random()<Math.pow(chance,1/3)];
 for(let i=0;i<3;i++){await sleep(250);sfx.wobble();await tween(.35,k=>ball.rotation.z=Math.sin(k*Math.PI*2)*.5);if(!wobbleOK[i]){bScene.remove(ball);bE.visible=true;burst(to,0xffffff,14);await tween(.25,k=>bE.scale.setScalar(s0*Math.max(.01,k)));bE.userData.busy=false;await say(pick(['Oh no! It broke free!','Argh! Almost had it!','Aww! It escaped!']),1100);return false}}
 sfx.catch();burst(ball.position,0xffeb3b,30);const isNew=!S.caught.includes(e.sp);markCaught(e.sp);e.xp=0;
 await say(`🎉 Gotcha! <b>${sp.name}</b> was caught!`,1800);if(isNew)await say(`${sp.name} was added to your Monster Book! 📖`,1400);
 if(S.party.length<6){S.party.push(e)}else{S.box.push(e);await say(`Your team is full, so ${sp.name} went to the Monster Box.`,1400)}
 bScene.remove(ball);if(B.wobj)removeWild(B.wobj);await endBattle('caught');return true}
async function gainXP(enemy){const p=S.party[B.pi];const amt=Math.round(enemy.lvl*(B.trainer?14:10)*(enemy.sp===JUMPSTAR?2:1));p.xp+=amt;await say(`${SPECIES[p.sp].name} gained ${amt} XP!`,900);
 while(p.xp>=xpNeed(p)){p.xp-=xpNeed(p);const before=stats(p).maxHp;const oldMoves=movesFor(p).length;p.lvl++;p.hp+=stats(p).maxHp-before;sfx.level();burst(bP.position,0x4aa3ff,20);refreshCards();await say(`⬆️ ${SPECIES[p.sp].name} grew to level ${p.lvl}!`,1200);
  if(movesFor(p).length>oldMoves)await say(`✨ ${SPECIES[p.sp].name} learned <b>${movesFor(p).slice(-1)[0].name}</b>!`,1400);}refreshCards()}
async function enemyFainted(){const e=B.enemyTeam[B.ei];await faintAnim(bE);await say(`${B.trainer?'':'Wild '}<b>${SPECIES[e.sp].name}</b> fainted!`,1000);await gainXP(e);
 if(B.wild){const coins=e.lvl*4;S.coins+=coins;await say(`You found 🪙 ${coins} coins!`,900);if(B.wobj)removeWild(B.wobj);await endBattle('win');return}
 B.ei++;if(B.ei<B.enemyTeam.length){const n=B.enemyTeam[B.ei];markSeen(n.sp);placeMon('e',n);refreshCards();await say(`${B.trainer.name} sends out <b>${SPECIES[n.sp].name}</b>!`,900);await popIn(bE);mainMenu();return}
 sfx.win();await say(`🏆 You beat <b>${B.trainer.name}</b>!`,1600);S.coins+=B.trainer.reward;await say(`You won 🪙 ${B.trainer.reward} coins!`,1100);
 if(B.trainer.friend){S.balls+=3;await say(`${B.trainer.name}: "Wow, you're really strong! Here, have 3 Jump Balls!"`,2000)}
 if(B.trainer.badge){const k=B.trainer.badge,L=LEADERS[k];if(!S.badges.includes(k)){S.badges.push(k);await say(`${L.icon} You earned the <b>${L.badge}</b>!`,2200);if(k==='champ')await say('👑 YOU ARE THE NEW CHAMPION! Amazing! 👑',3000)}}
 await endBattle('win')}
async function playerFainted(){const p=S.party[B.pi];await faintAnim(bP);await say(`<b>${SPECIES[p.sp].name}</b> fainted!`,1100);
 if(S.party.some(m=>m.hp>0)){switchMenu(true);return}
 await say('Oh no! All your monsters fainted!',1500);await say('You hurry back to the Healing Center…',1500);
 for(const m of S.party)m.hp=stats(m).maxHp;player.x=-14;player.z=10;player.y=0;await endBattle('lose');toast('💗 Nurse Penny healed your team!')}
async function forcedSwitch(i){setMenu([]);B.pi=i;placeMon('p',S.party[i]);refreshCards();await popIn(bP);await say(`Go, <b>${SPECIES[S.party[i].sp].name}</b>!`,900);mainMenu()}
async function runAway(){setMenu([]);if(B.trainer){await say('You gave up the battle. Train more and try again!',1400);await endBattle('run');return}
 if(Math.random()<.85||S.hero==='z'){await say('You got away safely! 🏃',1000);await endBattle('run')}else{await say("Couldn't get away!",900);const cur=S.party[B.pi];await attack(B.enemyTeam[B.ei],cur,enemyMove(),false);if(cur.hp<=0){await playerFainted();return}mainMenu()}}
async function endBattle(res){for(const q of parts)bScene.remove(q.p);parts.length=0;bAnims.length=0;$('battle').classList.add('hidden');showWorldUI();mode='world';encounterCD=2.5;
 if(B&&B.wobj&&res==='run'){const w=B.wobj;const a=Math.atan2(w.x-player.x,w.z-player.z);w.tx=w.x+Math.sin(a)*6;w.tz=w.z+Math.cos(a)*6;w.timer=3}
 B=null;updateHUD();save();checkQuests()}

// ================= start / UI flow =================
function showWorldUI(){$('hud').classList.remove('hidden');$('dpad').classList.remove('hidden');try{window.focus()}catch(e){}$('joy').classList.remove('hidden');$('touchBtns').classList.remove('hidden')}
let selHero=null,selStarter=null;
function buildTitle(){const hc=$('heroCards');for(const k in HEROES){const H=HEROES[k];const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="${H.img}"><b>${H.name}</b><small>${H.desc}</small><span class="perk">${H.perk}</span>`;c.onclick=()=>{selHero=k;[...hc.children].forEach(x=>x.classList.remove('sel'));c.classList.add('sel');$('btnHeroNext').disabled=false;sfx.click()};hc.appendChild(c)}
 const sc=$('starterCards');for(const i of STARTERS){const s=SPECIES[i];const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="${s.img}"><b>${s.name}</b>${typeTag(s.type)}<small>${s.desc}</small>`;c.onclick=()=>{selStarter=i;[...sc.children].forEach(x=>x.classList.remove('sel'));c.classList.add('sel');$('btnStart').disabled=false;sfx.click()};sc.appendChild(c)}
 const sv=loadSave();if(sv&&sv.party&&sv.party.length){$('btnContinue').classList.remove('hidden');$('btnContinue').textContent=`Continue as ${HEROES[sv.hero].name}`}}
$('btnHeroNext').onclick=()=>{$('title').classList.add('hidden');$('starter').classList.remove('hidden')};
$('btnStart').onclick=()=>{S=newState(selHero);const m=makeMon(selStarter,5);S.party.push(m);markCaught(selStarter);save();beginGame(true)};
$('btnContinue').onclick=()=>{S=Object.assign(newState('seb'),loadSave());beginGame(false)};
function beginGame(fresh){$('title').classList.add('hidden');$('starter').classList.add('hidden');
 const H=HEROES[S.hero];player.mesh=makePerson(H);scene.add(player.mesh);player.speedMul=S.hero==='z'?1.3:1;player.jumpMul=S.hero==='seb'?1.25:1;
 player.x=S.pos[0];player.y=S.pos[1]||0;player.z=S.pos[2];player.y=Math.max(0,player.y);
 for(const k in HEROES)if(k!==S.hero)addNPC(k,HEROES[k],FRIEND_HOMES[k][0],FRIEND_HOMES[k][1],k==='z'?10:5);
 addNPC('nurse_',Object.assign({name:'Nurse Penny'},NURSE),-14,14,2).nurse=true;
 const nn=npcs.find(n=>n.key==='nurse_');nn.def.img=snapCache('nurse');
 for(const c of chests)if(S.chests.includes(c.id)){c.lid.rotation.x=-1.2;c.lid.position.z=-.3;c.lid.position.y=1.2}
 if(!S.caught.includes(JUMPSTAR))spawnJumpstar();
 player.yaw=Math.PI;camYaw=0;
 mode='world';showWorldUI();updateHUD();showZone(ZONES.town.name);
 if(fresh)setTimeout(()=>openInfo('🌟 Welcome, '+H.name+'!',`<p style="font-size:18px">Your adventure in <b>Jumpstone Town</b> begins with your partner <b>${SPECIES[S.party[0].sp].name}</b>!</p><p>🐾 Walk into wild monsters to battle and catch them.<br>💬 Your friends are around town and the lands — press <b>E</b> to chat!<br>🏟️ Win badges at the 4 Stadiums.<br>☁️ Find the legendary Jumpstar…</p><p><b>Move:</b> WASD / arrows · <b>Jump:</b> Space · <b>Talk:</b> E · <b>Look:</b> drag</p>`),400)}
// nurse chat
TALK.nurse_={greet:["Hello dear! Welcome to Jumpstone Town!"],intro:"I'm Nurse Penny! I run the Healing Center. Come inside whenever your monsters need a rest.",fav:"I love all monsters equally! But Snowbun is very cuddly.",mood:["I'm wonderful, thank you for asking!"],filler:["Remember, healing is always free!","Take care of your monsters and they'll take care of you.","The Healing Center is the pink-roofed building right behind me."],adv:"An adventure? Make sure to bring Potions!",team:[[19,0],[4,1]]};

// ================= main loop =================
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);wTime+=dt;
 if(mode==='battle'){updateBattleScene(dt);renderer.render(bScene,bCam);return}
 if(mode==='world'){updatePlayer(dt);updateWild(dt);checkInteract()}
 else{$('prompt').classList.add('hidden')}
 if(mode!=='title'){updateNPCs(dt);updateCamera(dt);if((mmT+=dt)>.1){mmT=0;drawMinimap()}if(S&&Math.floor(wTime)%5===0&&Math.floor(wTime-dt)%5!==0){S.pos=[player.x,player.y,player.z];save();checkQuests()}}
 else{camera.position.set(Math.sin(wTime*.1)*40,22,Math.cos(wTime*.1)*40);camera.lookAt(0,0,0)}
 // ambient
 if(window._smoke)window._smoke.forEach((s,i)=>{s.position.y=24+((wTime*1.5+i*2)%12);s.material.opacity=.35});
 if(window._clouds)window._clouds.forEach((c,i)=>{c.position.x+=Math.sin(i)*dt*.5});
 const pa=snowGeo.attributes.position;for(let i=0;i<pa.count;i++){let y=pa.getY(i)-dt*3;if(y<0)y=25;pa.setY(i,y)}pa.needsUpdate=true;
 lanterns.forEach((l,i)=>l.scale.setScalar(.25+Math.sin(wTime*3+i)*.05));
 for(const c of chests)if(c.gold)c.g.rotation.y+=dt;
 renderer.render(scene,camera)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=bCam.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();bCam.updateProjectionMatrix()});
buildTitle();loop();
</script>
