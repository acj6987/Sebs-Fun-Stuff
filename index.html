<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Care Club PB</title>
<style>
  :root { --bg:#eaf6ea; --card:#fff; --ink:#1e3324; --green:#2f8f4e; --muted:#5b6f60; --warn:#fff3e0; --chip:#e2f3e5; --dark:#1e3324; --onDark:#fff; --line:#e3ece4; --map1:#cfe8c6; --map2:#c4e1b9; --err:#c0392b; --bee:#f6c431; --stripe:#2a2418; --wing:#dff1fb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121c15; --card:#1c2a20; --ink:#e3efe5; --green:#5cc07c; --muted:#9bb0a0; --warn:#3a2e1c; --chip:#25392b; --dark:#0b120d; --onDark:#e3efe5; --line:#2c3f31; --map1:#22382a; --map2:#1d3124; --err:#ff7b6b; --wing:#bcd9e8; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#121c15; --card:#1c2a20; --ink:#e3efe5; --green:#5cc07c; --muted:#9bb0a0; --warn:#3a2e1c; --chip:#25392b; --dark:#0b120d; --onDark:#e3efe5; --line:#2c3f31; --map1:#22382a; --map2:#1d3124; --err:#ff7b6b; --wing:#bcd9e8; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .lock { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { background:var(--card); padding:32px 24px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.12); text-align:center; max-width:380px; width:100%; }
  .box h1 { margin:.2em 0; color:var(--green); }
  .badge { display:inline-block; background:var(--dark); color:var(--onDark); padding:4px 12px; border-radius:99px; font-size:.8rem; letter-spacing:2px; }
  input[type=password] { font-size:1.6rem; letter-spacing:6px; text-align:center; width:100%; padding:12px; margin:16px 0 8px; border:3px solid var(--green); border-radius:12px; background:var(--card); color:var(--ink); }
  button { font:inherit; font-size:1.1rem; background:var(--green); color:#fff; border:0; padding:12px 24px; border-radius:12px; cursor:pointer; width:100%; }
  .err { color:var(--err); min-height:1.4em; }
  header { background:var(--green); color:#fff; padding:20px 16px; text-align:center; position:relative; }
  header h1 { margin:0; font-size:2rem; }
  header .logout { position:absolute; right:12px; top:12px; width:auto; padding:6px 12px; font-size:.9rem; background:rgba(0,0,0,.25); }
  main { max-width:820px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border-radius:16px; padding:16px 20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .card h2 { margin-top:0; color:var(--green); }
  .card.warn { background:var(--warn); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips span { background:var(--chip); padding:6px 12px; border-radius:99px; }
  .map { position:relative; height:380px; touch-action:none; border-radius:12px; background:repeating-linear-gradient(45deg,var(--map1),var(--map1) 12px,var(--map2) 12px,var(--map2) 24px); border:3px dashed var(--green); }
  .spot { position:absolute; cursor:grab; user-select:none; white-space:nowrap; background:var(--card); color:var(--ink); padding:6px 10px; border-radius:10px; font-size:.9rem; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .spot.secret { background:var(--dark); color:var(--onDark); }
  .small { color:var(--muted); font-size:.85rem; }
  .score input { font:inherit; width:80px; padding:4px; }
  .bee { width:110px; height:auto; display:block; margin:0 auto 8px; animation:buzz 2.4s ease-in-out infinite; }
  .small-bee { width:70px; margin-bottom:4px; }
  @keyframes buzz { 0%,100% { transform:translate(0,0) rotate(-3deg); } 50% { transform:translate(6px,-6px) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .bee { animation:none; } }
  .maplink { display:inline-block; margin-top:12px; background:var(--green); color:var(--onDark); padding:10px 16px; border-radius:12px; text-decoration:none; font-weight:bold; }
  .maplink:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  .spot.dragging { cursor:grabbing; outline:3px solid var(--green); z-index:2; }
  .reset { width:auto; margin-top:10px; font-size:.9rem; padding:8px 14px; background:var(--chip); color:var(--ink); }
  .copy { user-select:all; background:var(--chip); padding:2px 6px; border-radius:6px; word-break:break-all; }
  .tries { color:var(--muted); font-size:.9rem; min-height:1.2em; margin-bottom:8px; }
  #lockedForm h1 { color:var(--err); font-size:1.5rem; }
  #lockedForm input { font-size:1.2rem; letter-spacing:2px; text-align:center; width:100%; padding:12px; margin:16px 0 8px; border:3px solid var(--err); border-radius:12px; background:var(--card); color:var(--ink); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="box" id="form">
    <svg class="bee" viewBox="0 0 120 90" role="img" aria-label="A friendly bee">
      <ellipse cx="50" cy="22" rx="20" ry="14" fill="var(--wing)" stroke="var(--stripe)" stroke-width="2"/>

      <ellipse cx="60" cy="54" rx="38" ry="26" fill="var(--bee)" stroke="var(--stripe)" stroke-width="3"/>

      <circle cx="88" cy="48" r="5" fill="var(--stripe)"/><circle cx="90" cy="46" r="1.6" fill="var(--bee)"/>
      <path d="M84 60 Q90 65 95 59" fill="none" stroke="var(--stripe)" stroke-width="2.5" stroke-linecap="round"/>

    </svg>
    <div class="badge">🔒 TOP SECRET</div>
    <h1>🐾 Animal Care Club PB</h1>
    <p>Members only. Enter the secret password.</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="off" placeholder="••• •••" autofocus>
    <div class="err" id="err"></div>
    <div class="tries" id="tries"></div>
    <button type="submit">Unlock</button>
  </form>
  <form class="box" id="lockedForm" hidden>
    <div class="badge">🚫 LOCKED</div>
    <h1>Too many wrong tries</h1>
    <p>This page is locked. Ask Seb for the unlock code, then type it here to get 6 more tries.</p>
    <input type="password" id="unlockCode" autocomplete="off" placeholder="Unlock code">
    <div class="err" id="lockErr"></div>
    <button type="submit">Use unlock code</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <svg class="bee small-bee" viewBox="0 0 120 90" role="img" aria-label="A friendly bee">
      <ellipse cx="50" cy="22" rx="20" ry="14" fill="var(--wing)" stroke="var(--stripe)" stroke-width="2"/>
      <ellipse cx="74" cy="20" rx="17" ry="12" fill="var(--wing)" stroke="var(--stripe)" stroke-width="2"/>
      <ellipse cx="60" cy="54" rx="38" ry="26" fill="var(--bee)" stroke="var(--stripe)" stroke-width="3"/>
      <path d="M48 30 Q42 54 48 78 L60 80 Q54 54 60 28 Z M70 29 Q64 54 70 79 L80 76 Q75 54 80 32 Z" fill="var(--stripe)"/>
      <path d="M22 54 L8 54" stroke="var(--stripe)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="88" cy="48" r="5" fill="var(--stripe)"/><circle cx="90" cy="46" r="1.6" fill="var(--bee)"/>
      <path d="M84 60 Q90 65 95 59" fill="none" stroke="var(--stripe)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M86 30 Q90 16 98 12 M92 32 Q100 22 108 22" fill="none" stroke="var(--stripe)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="98" cy="12" r="3" fill="var(--stripe)"/><circle cx="108" cy="22" r="3" fill="var(--stripe)"/>
    </svg>
    <div class="badge">🔒 TOP SECRET</div>
    <h1>🐾 Animal Care Club PB</h1>
    <button class="logout" id="logout">Lock 🔒</button>
  </header>
  <main id="content"></main>
</div>

  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i += 32) {
    const ks = sha256(cat(key, new Uint8Array([i >>> 24, i >>> 16 & 255, i >>> 8 & 255, i & 255])));
    for (let j = 0; j < 32 && i + j < data.length; j++) out[i + j] = data[i + j] ^ ks[j];
  }
  return out;
}

const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
function unlock(pw) {
  const out = new TextDecoder().decode(crypt(pw, b(DATA.s), b(DATA.c)));
  if (!out.startsWith('ACC:')) throw new Error('wrong');
  return out.slice(4);
}

const UNLOCK = {"s":"5b69aad28999dac1","h":"0f6424b1b1177ba66b6a7fdf0cd688e4c50c6d54f282bf1a76d493e019d07e21"};
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : Number(v); } catch (_) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (_) {} }
};
function hex(u) { return Array.from(u, x => x.toString(16).padStart(2, '0')).join(''); }
function showTries() {
  const left = store.get('allowed', 2) - store.get('wrong', 0);
  const locked = left <= 0;
  document.getElementById('form').hidden = locked;
  document.getElementById('lockedForm').hidden = !locked;
  document.getElementById('tries').textContent = store.get('wrong', 0) > 0 ? 'Tries left: ' + left : '';
}
showTries();

document.getElementById('lockedForm').addEventListener('submit', e => {
  e.preventDefault();
  const code = document.getElementById('unlockCode').value.trim().toUpperCase();
  document.getElementById('unlockCode').value = '';
  if (hex(sha256(new TextEncoder().encode(UNLOCK.s + code))) === UNLOCK.h) {
    store.set('allowed', store.get('wrong', 0) + 6);
    document.getElementById('lockErr').textContent = '';
    document.getElementById('err').textContent = 'You have 6 more tries.';
    showTries();
  } else {
    document.getElementById('lockErr').textContent = 'That unlock code is wrong. Ask Seb for the right one.';
  }
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const pw = document.getElementById('pw').value.replace(/\D/g, '');
  err.textContent = 'Checking…';
  await new Promise(r => setTimeout(r, 30));
  try {
    document.getElementById('content').innerHTML = unlock(pw);
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false;
    err.textContent = '';
    store.set('wrong', 0); store.set('allowed', 2); showTries();
    initMap();
    const score = document.getElementById('bugScore');
    if (score) {
      try { score.value = localStorage.getItem('bugScore') || 0; } catch (_) {}
      score.addEventListener('input', () => { try { localStorage.setItem('bugScore', score.value); } catch (_) {} });
    }
  } catch (e) {
    store.set('wrong', store.get('wrong', 0) + 1);
    err.textContent = '❌ Wrong password! Access denied.';
    showTries();
  }
  document.getElementById('pw').value = '';
});

function initMap() {
  const map = document.getElementById('map');
  if (!map) return;
  const start = {};
  map.querySelectorAll('.spot').forEach(el => {
    start[el.dataset.id] = [el.style.left, el.style.top];
    try { const p = JSON.parse(localStorage.getItem('spot-' + el.dataset.id)); if (p) { el.style.left = p[0]; el.style.top = p[1]; } } catch (_) {}
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('dragging');
      const r = map.getBoundingClientRect(), er = el.getBoundingClientRect();
      const dx = e.clientX - er.left, dy = e.clientY - er.top;
      const move = ev => {
        const x = Math.min(Math.max(ev.clientX - r.left - dx, 0), r.width - er.width);
        const y = Math.min(Math.max(ev.clientY - r.top - dy, 0), r.height - er.height);
        el.style.left = (x / r.width * 100).toFixed(1) + '%'; el.style.top = (y / r.height * 100).toFixed(1) + '%';
      };
      const up = () => {
        el.classList.remove('dragging'); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
        try { localStorage.setItem('spot-' + el.dataset.id, JSON.stringify([el.style.left, el.style.top])); } catch (_) {}
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
  });
  document.getElementById('resetMap').addEventListener('click', () => {
    map.querySelectorAll('.spot').forEach(el => {
      [el.style.left, el.style.top] = start[el.dataset.id];
      try { localStorage.removeItem('spot-' + el.dataset.id); } catch (_) {}
    });
  });
}

document.getElementById('logout').addEventListener('click', () => {
  document.getElementById('content').innerHTML = '';
  document.getElementById('app').hidden = true;
  document.getElementById('lock').hidden = false;
});
</script>
