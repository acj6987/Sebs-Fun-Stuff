<style>
/* Layout: a game screen — sticky top bar with money and tickets, a scrolling stage below that swaps between Map, Area, Tank, Dive and Book views. Single deep-sea look. */
:root{
  --abyss:#031a2e;
  --deep:#06304f;
  --panel:#0a4469;
  --panel-hi:#105c8a;
  --line:#1f7bb0;
  --foam:#eafcff;
  --mist:#9cc9dd;
  --sun:#ffd24a;
  --coral:#ff6f7d;
  --kelp:#3ddc97;
  --ink:#04121f;
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);background:var(--sun);border:0;border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 #b8901c;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b8901c}
button:disabled{background:#4d6878;color:#9fb4c0;box-shadow:none;cursor:not-allowed}
button.ghost{background:var(--panel-hi);color:var(--foam);box-shadow:0 3px 0 #06324f}
button.ghost.on{background:var(--kelp);color:var(--ink);box-shadow:0 3px 0 #1d8b5c}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--deep);border-bottom:2px solid var(--line);position:relative;z-index:5}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.money{color:var(--sun);font-size:18px}
.pill button{padding:2px 9px;border-radius:8px;font-size:15px;box-shadow:none}
.pill small{font-family:var(--body);color:var(--mist);font-weight:700;font-size:12px}
#main{flex:1;min-height:0;overflow:auto;position:relative;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#main.full{padding:0;overflow:hidden}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:30px}
h2{font-size:22px}
.muted{color:var(--mist)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.hero p{margin:4px 0 0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.locked{background:#08324f;border-style:dashed;cursor:default}
.card .big{font-size:42px;line-height:1}
.card h3{font-size:19px}
.card p{margin:0;font-size:13px;color:var(--mist)}
.stat{font-size:13px;font-weight:800;color:var(--kelp)}
.tankcard canvas{width:100%;aspect-ratio:16/9;border-radius:10px;display:block;background:#000}
.walk{width:100%;height:100px;display:block;margin-top:16px;border-radius:14px}
#tankwrap{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
#tankbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#tankbar h2{margin-right:auto}
#tankstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#tankcv{border-radius:14px;border:6px solid #2b5d7c;box-shadow:0 0 0 2px #0e2c40,0 10px 30px #0008;touch-action:none;max-width:100%}
.hint{background:var(--kelp);color:var(--ink);font-weight:800;border-radius:10px;padding:6px 12px;font-size:14px}
/* sheets */
#sheet{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .box{background:var(--deep);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:min(760px,100%);max-height:78%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#sheet .head h2{margin-right:auto}
#sheet .list{overflow:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:8px 10px}
.item img{width:48px;height:48px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{font-family:var(--display);font-size:17px;display:block}
.item .t span{font-size:12px;color:var(--mist)}
.price{font-family:var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.decgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dec{background:var(--panel);border:2px solid transparent;border-radius:14px;padding:8px;text-align:center;cursor:pointer;color:var(--foam);box-shadow:none;font-family:var(--body)}
.dec img{width:44px;height:44px;display:block;margin:0 auto 4px}
.dec.sel{border-color:var(--sun)}
.dec small{display:block;color:var(--sun);font-family:var(--display)}
/* dive */
#dive{position:absolute;inset:0}
#divecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.o2{width:180px;height:16px;border-radius:999px;background:#0008;border:2px solid #fff8;overflow:hidden}
.o2 i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#7ef0ff);border-radius:999px}
.o2.low i{background:var(--coral)}
.hudtxt{font-family:var(--display);font-weight:600;text-shadow:0 2px 4px #000a;font-size:15px}
.divebtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.divebtns button{font-size:17px;padding:12px 16px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
/* book */
.bookarea{margin:18px 0 8px;display:flex;gap:10px;align-items:baseline}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.bk{background:var(--panel);border-radius:14px;padding:10px;text-align:center;font-size:13px;min-width:0}
.bk img{width:56px;height:56px;display:block;margin:0 auto 4px}
.bk b{font-family:var(--display);display:block;font-size:14px}
.bk.no{opacity:.75}
/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,92%)}
.toast{background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:600;padding:10px 16px;border-radius:14px;box-shadow:0 6px 20px #0007;text-align:center;animation:pop .25s ease-out}
.toast.big{font-size:20px;background:var(--kelp)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.coin{position:fixed;z-index:31;color:var(--sun);font-family:var(--display);font-weight:700;pointer-events:none;animation:rise 1.2s ease-out forwards;text-shadow:0 2px 3px #000}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
input.name{font-family:var(--display);font-size:20px;font-weight:700;background:var(--panel);color:var(--foam);border:2px solid var(--line);border-radius:10px;padding:4px 8px;width:min(260px,60vw)}
@media (max-width:560px){.brand{font-size:17px;flex-basis:100%}h1{font-size:24px}.pill.money{font-size:16px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.toast,.coin{animation:none}}
</style>

<div id="app">

  </header>
  <div id="main"></div>
</div>

const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const sprites = new Map();
function sprite(e, px, tint, alpha) {
  px = Math.max(8, Math.round(px / 4) * 4);
  const k = e + "|" + px + "|" + tint + "|" + (alpha || "");
  let c = sprites.get(k);
  if (c) return c;
  const pad = Math.ceil(px * .3), w = px + pad * 2;
  c = document.createElement("canvas"); c.width = c.height = w;
  const g = c.getContext("2d");
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = px + "px " + EMOJI_FONT;
  g.fillText(e, w / 2, w / 2 + px * .07);
  if (tint) { g.globalCompositeOperation = "source-atop"; g.globalAlpha = alpha || .5; g.fillStyle = tint; g.fillRect(0, 0, w, w); }
  c.pad = pad;

  return c;
}
// draw an emoji centred on x,y with logical size, given the context's pixel scale
function emo(ctx, e, x, y, size, scale, tint, flip, alpha, tintAlpha) {
  const c = sprite(e, size * scale, tint, tintAlpha);
  const w = c.width / scale * (size * scale / (c.width - c.pad * 2));
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(c, -w / 2, -w / 2, w, w);
  ctx.restore();
}
const imgCache = new Map();
function emoImg(e, tint, silhouette) {
  const k = e + tint + (silhouette ? "s" : "");
  if (imgCache.has(k)) return imgCache.get(k);
  const c = sprite(e, 96, silhouette ? "#021625" : tint, silhouette ? 1 : .5);
  const u = c.toDataURL();
  imgCache.set(k, u);
  return u;
}
function animalImg(a, sil) { return emoImg(a.e, a.tint, sil); }

// ---------- economy ----------
function animalAppeal(a) { return 2 + Math.sqrt(a.price) / 2; }
function tankAppeal(t) {
  let A = 0;
  t.animals.forEach(id => { const a = ANIMAL[id]; if (a) A += animalAppeal(a); });
  if (!t.animals.length) return 0;
  const d = t.decor.reduce((s, x) => s + Math.sqrt((DEC[x.d] || { c: 50 }).c) / 4, 0);
  return A + Math.min(d, A * 1.5);
}
let econ = { A: 0, worth: 0, vps: 0 };
function recalc() {
  let A = 0; const areas = new Set();
  S.tanks.forEach(t => { const v = tankAppeal(t); A += v; if (v) areas.add(t.area); });
  A *= 1 + .1 * Math.max(0, areas.size - 1);
  const worth = 20 + A * .8;
  const vps = A ? Math.pow(A, .8) / 20 * Math.exp(-S.ticket / worth) : 0;
  econ = { A, worth, vps };
  updateHeader();
}
function moodText() {
  if (!econ.A) return "no animals yet";
  const r = S.ticket / econ.worth;
  if (r < .5) return "super cheap";
  if (r < .85) return "cheap";
  if (r < 1.25) return "just right";
  if (r < 2) return "expensive!";
  return "WAY too expensive";
}
function tankCost() { return Math.round(2000 * Math.pow(1.35, S.tanks.length) / 100) * 100; }
function tankSpace(t) { return t.animals.reduce((s, id) => s + (ANIMAL[id] ? ANIMAL[id].space : 1), 0); }
function upgradeCost(t) { return 1500 * ((t.cap - 12) / 6 + 1); }

// ---------- tank simulation ----------
const LW = 800, LH = 450;
const RT = new Map(); // tank id -> runtime {critters, food, hearts}
function geo(area) {
  const ar = AREA[area];
  const landW = ar.land ? ar.land * LW : 0;
  return { ar, landW, waterTop: ar.land ? 112 : 6, bed: LH - 42, hasLand: !!ar.land };
}
function landTop(g, x) { return 100 + (x / g.landW) * 22; }
function onLand(g, x) { return g.hasLand && x < g.landW; }
function waterX0(g) { return g.hasLand ? g.landW + 50 : 20; }
function makeCritter(id, g) {
  const a = ANIMAL[id];
  const c = { id, a, x: rand(waterX0(g), LW - 30), y: rand(g.waterTop + 30, g.bed - 30), tx: 0, ty: 0, dir: 1, t: 0, phase: rand(0, 6.28), land: false, timer: rand(3, 9), happy: 0, spd: rand(35, 70) * (a.size > 70 ? .6 : 1) };
  if (a.move === "a" && g.hasLand && Math.random() < .5) { c.land = true; c.x = rand(10, g.landW - 20); }
  newTarget(c, g);
  c.x = clamp(c.x, 10, LW - 10);
  return c;
}
function newTarget(c, g) {
  const a = c.a, half = a.size * .4;
  const x0 = waterX0(g) + half, x1 = LW - half;
  if (a.move === "a" && g.hasLand && c.land) { c.tx = rand(10 + half, g.landW - half); c.ty = landTop(g, c.tx) - a.size * .38; return; }
  if (a.move === "b") { c.tx = rand(x0, x1); c.ty = g.bed - a.size * .36; return; }
  if (a.move === "u") { c.tx = rand(x0, x1); c.ty = g.waterTop + 4 - a.size * .2; return; }
  c.tx = rand(x0, x1);
  c.ty = rand(g.waterTop + half + 8, g.bed - half - 4);
}
function rtFor(t) {
  let r = RT.get(t.id);
  const g = geo(t.area);
  if (!r) { r = { critters: [], food: [], hearts: [] }; RT.set(t.id, r); }
  // sync critters with saved animal list
  const want = t.animals.slice();
  const keep = [];
  r.critters.forEach(c => { const i = want.indexOf(c.id); if (i >= 0) { want.splice(i, 1); keep.push(c); } });
  want.forEach(id => { if (ANIMAL[id]) keep.push(makeCritter(id, g)); });
  r.critters = keep;
  return r;
}
function stepTank(t, dt) {
  const r = rtFor(t), g = geo(t.area);
  r.food.forEach(f => { f.y = Math.min(f.y + 26 * dt, g.bed - 4); f.life -= dt; });
  r.food = r.food.filter(f => f.life > 0);
  r.hearts.forEach(h => { h.y -= 30 * dt; h.life -= dt; });
  r.hearts = r.hearts.filter(h => h.life > 0);
  r.critters.forEach(c => {
    const a = c.a;
    c.t += dt; c.timer -= dt; c.happy = Math.max(0, c.happy - dt);
    // amphibians switch between land and water
    if (a.move === "a" && g.hasLand && c.timer <= 0) { c.land = !c.land; c.timer = rand(5, 12); newTarget(c, g); }
    let tx = c.tx, ty = c.ty;
    // chase food
    if ((a.move === "s" || a.move === "f" || (a.move === "a" && !c.land) || a.move === "b") && r.food.length) {
      let best = null, bd = 260 * 260;
      r.food.forEach(f => { const d = (f.x - c.x) ** 2 + (f.y - c.y) ** 2; if (d < bd) { bd = d; best = f; } });
      if (best) {
        tx = best.x; ty = a.move === "b" ? c.ty : best.y;
        if (bd < (a.size * .5) ** 2 + 60) { best.life = 0; c.happy = 1.2; r.hearts.push({ x: c.x, y: c.y - a.size * .5, life: 1.2 }); }
      }
    }
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    const spd = c.spd * (a.move === "f" ? .45 : a.move === "b" ? .5 : 1) * (r.food.length ? 1.6 : 1);
    if (d < 4) { if (tx === c.tx && ty === c.ty) newTarget(c, g); }
    else {
      const k = Math.min(1, spd * dt / d);
      c.x += dx * k; c.y += dy * k;
      if (Math.abs(dx) > 2) c.dir = dx > 0 ? 1 : -1;
    }
    // amphibian walking on land follows ground
    if (a.move === "a" && g.hasLand && onLand(g, c.x) && c.land) c.y = Math.min(c.y, landTop(g, c.x) - a.size * .38);
  });
}
function drawTank(ctx, t, W, H, time, opts) {
  const s = W / LW, dpr = DPR(), sc = s * dpr;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  const g = geo(t.area), ar = g.ar;
  // sky for land tanks
  if (g.hasLand) { ctx.fillStyle = ar.sky; ctx.fillRect(0, 0, LW, g.waterTop); }
  const wg = ctx.createLinearGradient(0, g.waterTop, 0, LH);
  wg.addColorStop(0, ar.top); wg.addColorStop(1, ar.bot);
  ctx.fillStyle = wg; ctx.fillRect(0, g.waterTop, LW, LH - g.waterTop);
  // light rays
  if (!ar.dark) {
    ctx.save(); ctx.globalAlpha = .08; ctx.fillStyle = "#fff";
    for (let i = 0; i < 5; i++) {
      const x = ((i * 190 + time * 12) % (LW + 200)) - 100;
      ctx.beginPath(); ctx.moveTo(x, g.waterTop); ctx.lineTo(x + 60, g.waterTop); ctx.lineTo(x + 160, LH); ctx.lineTo(x + 40, LH); ctx.fill();
    }
    ctx.restore();
  }
  // kelp strands
  if (ar.kelp) {
    ctx.save(); ctx.strokeStyle = "#2f8f4e"; ctx.lineWidth = 9; ctx.lineCap = "round";
    for (let i = 0; i < 7; i++) {
      const bx = 60 + i * 115; ctx.beginPath(); ctx.moveTo(bx, g.bed);
      for (let y = g.bed; y > 30; y -= 20) ctx.lineTo(bx + Math.sin(y / 40 + time + i) * 14, y);
      ctx.stroke();
    }
    ctx.restore();
  }
  // sand bed
  ctx.fillStyle = ar.sand;
  ctx.beginPath(); ctx.moveTo(0, LH);
  for (let x = 0; x <= LW; x += 20) ctx.lineTo(x, g.bed + 6 * Math.sin(x / 50) + 4);
  ctx.lineTo(LW, LH); ctx.fill();
  // land bank
  if (g.hasLand) {
    ctx.fillStyle = ar.landCol;
    ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(g.landW, landTop(g, g.landW)); ctx.quadraticCurveTo(g.landW + 40, 200, g.landW + 70, g.bed + 6); ctx.lineTo(0, LH); ctx.fill();
    ctx.fillStyle = "#0002"; ctx.fillRect(0, LH - 20, g.landW + 70, 20);
    if (ar.trees) { emo(ctx, "🌴", 40, 70, 70, sc); emo(ctx, "🌳", g.landW - 60, 66, 80, sc); }
    if (ar.ice) { emo(ctx, "❄️", 60, 40, 22, sc, "", false, .8); emo(ctx, "❄️", 180, 26, 16, sc, "", false, .7); }
    if (t.area === "shore") emo(ctx, "⛱️", 60, 72, 56, sc);
    if (t.area === "river") emo(ctx, "🌾", 50, 82, 44, sc);
    // waterline shimmer
    ctx.fillStyle = "#ffffff55"; ctx.fillRect(g.landW, g.waterTop - 1, LW - g.landW, 3);
  }
  // decor
  t.decor.forEach(d => { const D = DEC[d.d]; if (D) emo(ctx, D.e, d.x, d.y, D.s, sc, D.t, false, null, .55); });
  // bubbles
  ctx.fillStyle = "#ffffff66";
  for (let i = 0; i < 10; i++) {
    const bx = (i * 97 + 40) % LW, by = LH - ((time * (30 + i * 3) + i * 61) % (LH - g.waterTop));
    if (onLand(g, bx + 40)) continue;
    ctx.beginPath(); ctx.arc(bx + Math.sin(time * 2 + i) * 4, by, 2 + (i % 3), 0, 7); ctx.fill();
  }
  const r = rtFor(t);
  r.food.forEach(f => { ctx.fillStyle = "#e8a04a"; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); });
  // critters
  const glow = [];
  r.critters.forEach(c => {
    const a = c.a;
    let y = c.y, sz = a.size * (1 + (c.happy > 0 ? .15 * Math.sin(c.happy * 12) : 0));
    if (a.move === "f") y += Math.sin(c.t * 1.6 + c.phase) * 6;
    else if (a.move === "u") y += Math.sin(c.t * 2 + c.phase) * 2;
    else if (a.move !== "b") y += Math.sin(c.t * 3 + c.phase) * 1.5;
    if (a.glow && ar.dark) glow.push([c, y, sz]);
    else emo(ctx, a.e, c.x, y, sz, sc, a.tint, c.dir > 0, null, a.tint === "#ffffff" ? .7 : .5);
  });
  if (ar.dark) {
    const vg = ctx.createRadialGradient(LW / 2, LH / 2, 80, LW / 2, LH / 2, 480);
    vg.addColorStop(0, "#0000"); vg.addColorStop(1, "#000c");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, LW, LH);
  }
  glow.forEach(([c, y, sz]) => {
    ctx.save(); ctx.shadowColor = c.a.tint || "#7ff"; ctx.shadowBlur = 24;
    emo(ctx, c.a.e, c.x, y, sz, sc, c.a.tint, c.dir > 0);
    ctx.restore();
  });
  r.hearts.forEach(h => emo(ctx, "❤️", h.x, h.y, 16, sc, "", false, Math.min(1, h.life)));
  if (opts && opts.empty && !t.animals.length) {
    ctx.fillStyle = "#0007"; ctx.fillRect(0, LH / 2 - 34, LW, 68);
    ctx.fillStyle = "#fff"; ctx.font = "600 26px " + "Fredoka, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(opts.empty, LW / 2, LH / 2);
  }
}
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = DPR();
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }

}

function stepDive(dt) {

  // air
  if (dv.y < 30) st.o2 = Math.min(1, st.o2 + dt * .5);
  else st.o2 -= dt / st.o2max;
  if (st.o2 <= 0) {
    st.o2 = 1; dv.x = 260; dv.y = 30; dv.vx = dv.vy = 0;
    toast("Out of air! The boat pulled you back up. Remember to swim to the surface to breathe! 🫧", true);
  }
  // bubbles
  if (dv.y > 40 && Math.random() < dt * 5) st.bubbles.push({ x: dv.x + dv.dir * 18, y: dv.y - 12, r: rand(2, 5), life: 2.5 });
  st.bubbles.forEach(b => { b.y -= 60 * dt; b.x += Math.sin(b.y / 15) * .4; b.life -= dt; });
  st.bubbles = st.bubbles.filter(b => b.life > 0 && b.y > 0);

  st.critters.forEach(c => {
    const a = c.a; c.t += dt;

      if (a.move === "b") c.ty = st.bed(c.tx) - a.size * .4;
      else if (a.move === "u") c.ty = 8;
      else if (a.move === "a") c.ty = rand(8, Math.min(300, st.bed(c.tx) - 60));
      else c.ty = st.area === "deep" ? rand(st.Dp * .3, st.bed(c.tx) - 60) : rand(50, st.bed(c.tx) - 60);

      const k = Math.min(1, c.spd * (a.move === "b" || a.move === "f" ? .4 : 1) * dt / d);

      if (a.move === "b") c.y = st.bed(c.x) - a.size * .4;

  // surface line
  ctx.fillStyle = "#ffffff66";
  for (let x = Math.floor(x0 / 40) * 40; x < x1 + 40; x += 40) ctx.fillRect(x, Math.sin(x / 50 + st.t * 2) * 3 - 1, 24, 3);
  // sea floor
  ctx.fillStyle = ar.sand;
  ctx.beginPath(); ctx.moveTo(x0 - 20, st.Dp + 300);
  for (let x = x0 - 20; x <= x1 + 20; x += 20) ctx.lineTo(x, st.bed(x));
  ctx.lineTo(x1 + 20, st.Dp + 300); ctx.fill();
  ctx.fillStyle = "#0003"; ctx.beginPath(); ctx.moveTo(x0 - 20, st.Dp + 300);
  for (let x = x0 - 20; x <= x1 + 20; x += 20) ctx.lineTo(x, st.bed(x) + 40);
  ctx.lineTo(x1 + 20, st.Dp + 300); ctx.fill();
  const vis = (x, m) => x > x0 - m && x < x1 + m;
  st.scenery.forEach(s => { if (vis(s.x, 80)) emo(ctx, s.e, s.x, st.bed(s.x) - s.s * .35, s.s, dpr); });
  (S.planted[st.area] || []).forEach(p => { if (vis(p.x, 60)) emo(ctx, "🪸", p.x, st.bed(p.x) - p.s * .38, p.s, dpr, p.t, false, null, .55); });
  st.chests.forEach(c => { if (!c.got && vis(c.x, 60)) emo(ctx, "💰", c.x, st.bed(c.x) - 18 + Math.sin(st.t * 3 + c.x) * 2, 34, dpr); });
  // creatures
  const dv = st.diver, glow = [], labels = [];
  st.critters.forEach(c => {
    if (!vis(c.x, 120)) return;
    const a = c.a, sz = a.size * 1.25;
    const y = c.y + (a.move === "f" ? Math.sin(c.t * 1.6) * 8 : Math.sin(c.t * 3) * 2);
    if (a.glow) glow.push([c, y, sz]); else emo(ctx, a.e, c.x, y, sz, dpr, a.tint, c.dir > 0, null, a.tint === "#ffffff" ? .7 : .5);
    const d = Math.hypot(c.x - dv.x, c.y - dv.y);
    if (d < 240) labels.push([c, y, sz]);
  });
  ctx.fillStyle = "#ffffff99";
  st.bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); });
  emo(ctx, "🏊", dv.x, dv.y, 48, dpr, "", dv.dir > 0);
  ctx.restore();
  // darkness grows with depth; the diver's torch lights a circle
  const depthF = clamp(dv.y / (ar.dark ? 1500 : 2400), 0, 1);
  const dark = ar.dark ? .3 + .65 * depthF : .55 * depthF;
  if (dark > .02) {
    const sx = dv.x - st.cam.x, sy = dv.y - st.cam.y;
    const rg = ctx.createRadialGradient(sx, sy, 60, sx, sy, Math.max(260, 420 - depthF * 160));
    rg.addColorStop(0, "rgba(0,4,12,0)"); rg.addColorStop(1, `rgba(0,4,12,${dark})`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  }
  ctx.save(); ctx.translate(-st.cam.x, -st.cam.y);
  glow.forEach(([c, y, sz]) => { ctx.save(); ctx.shadowColor = c.a.tint || "#7ff"; ctx.shadowBlur = 26; emo(ctx, c.a.e, c.x, y, sz, dpr, c.a.tint, c.dir > 0); ctx.restore(); });
  ctx.font = "600 14px Fredoka, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  labels.forEach(([c, y, sz]) => {
    const known = S.discovered[c.a.id];
    const txt = known ? c.a.name : "❓ New animal! Swim to it";
    const tw = ctx.measureText(txt).width + 14, ly = y - sz * .55 - 4;
    ctx.fillStyle = known ? "#000a" : "#ffd24a"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(c.x - tw / 2, ly - 20, tw, 22, 8) : ctx.rect(c.x - tw / 2, ly - 20, tw, 22); ctx.fill();
    ctx.fillStyle = known ? "#fff" : "#04121f"; ctx.fillText(txt, c.x, ly - 2);
  });
  ctx.restore();
  // minimap progress
  ctx.fillStyle = "#0007"; ctx.fillRect(w - 170, 14, 156, 8);
  ctx.fillStyle = "#ffd24a"; ctx.fillRect(w - 170 + (dv.x / st.W) * 150, 11, 6, 14);
}

// ---------- visitors walkway ----------
const walkers = [];
function drawWalk(cv, dt, time) {
  const { w, h } = fit(cv), dpr = DPR(), ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = ctx.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "#0d5a86"); gr.addColorStop(1, "#083c5c");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#c9b48a"; ctx.fillRect(0, h - 20, w, 20);
  ctx.fillStyle = "#ffffff22"; for (let x = 0; x < w; x += 60) ctx.fillRect(x, h - 20, 30, 2);
  const want = clamp(Math.round(econ.vps * 25), econ.vps > 0 ? 1 : 0, 40);
  while (walkers.length < want) walkers.push({ e: pick(PEOPLE), x: Math.random() < .5 ? -30 : w + 30, dir: 0, spd: rand(30, 60), stop: rand(1, 6), look: 0, bob: rand(0, 6) });
  while (walkers.length > want) walkers.pop();
  walkers.forEach(p => {
    if (!p.dir) p.dir = p.x < 0 ? 1 : -1;
    if (p.look > 0) p.look -= dt;
    else { p.x += p.dir * p.spd * dt; p.stop -= dt; if (p.stop < 0) { p.look = rand(1, 3); p.stop = rand(3, 8); } }
    if (p.x > w + 40 || p.x < -40) { p.x = p.dir > 0 ? -30 : w + 30; p.e = pick(PEOPLE); }
    const y = h - 36 + (p.look > 0 ? 0 : Math.abs(Math.sin(time * 6 + p.bob)) * -3);
    emo(ctx, p.e, p.x, y, 34, dpr, "", p.dir > 0);
    if (p.look > 0) emo(ctx, ["😮", "😍", "🤩", "📸"][Math.floor(p.bob) % 4], p.x, y - 28, 16, dpr);
  });
  ctx.fillStyle = "#eafcff"; ctx.font = "600 14px Fredoka, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(econ.vps ? `Visitors are paying ${fmt(S.ticket)} each to see your animals` : "Add animals to an aquarium and visitors will start coming!", 12, 8);
}

// ---------- main loop ----------
let last = performance.now(), arrive = 0, saveTick = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const time = now / 1000;
  // visitors pay tickets
  if (econ.vps > 0) {
    arrive += econ.vps * dt;
    if (arrive >= 1) {
      const n = Math.floor(arrive); arrive -= n;
      const gain = n * S.ticket;
      S.money += gain; S.visitorsTotal += n; updateHeader();
      if (view !== "dive" && Math.random() < .5) coinPop(gain);
    }
  }
  if (view === "tank") {
    const t = getTank(cur.tank), cv = $("#tankcv");
    if (t && cv) { stepTank(t, dt); const { w, h } = fit(cv); drawTank(cv.getContext("2d"), t, w, h, time, { empty: "Tap 🛒 Animals to add some!" }); }
  } else if (view === "area") {
    document.querySelectorAll("canvas[data-tank]").forEach(cv => {
      const t = getTank(+cv.dataset.tank); if (!t) return;
      stepTank(t, dt); const { w, h } = fit(cv); drawTank(cv.getContext("2d"), t, w, h, time, { empty: "Empty — tap to add animals" });
    });
  } else if (view === "dive" && D) stepDive(dt);
  const wk = $("#walk"); if (wk) drawWalk(wk, dt, time);
  requestAnimationFrame(frame);
}

renderBrand();
recalc();
render();
requestAnimationFrame(frame);
})();
</script>
